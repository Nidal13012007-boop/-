/* ألعاب جماعية - الأنماط والثيمات الثلاثة */
:root{--xc:#6D4AFF;--oc:#14B8A6;--bg:#F7F5FF;--card:#fff;--t:#1B1630;--mut:#6b6785;--bd:#e4e0f5;--ic:#14B8A6;--pbg:#6D4AFF;--on:#fff;--hbg:linear-gradient(135deg,#6D4AFF,#8B6CFF);--hfg:#fff;--sh:0 6px 18px rgba(109,74,255,.12);--gi:#d9fbf5}
[data-theme=dark]{--xc:#A48CFF;--oc:#2DD4BF;--bg:#12101F;--card:#1D1A33;--t:#F4F2FF;--mut:#a9a4c8;--bd:#2e2a4d;--ic:#2DD4BF;--pbg:#8B6CFF;--on:#0f0c1d;--hbg:#1D1A33;--hfg:#F4F2FF;--sh:0 6px 18px rgba(0,0,0,.35);--gi:#26224a}
[data-theme=gold]{--xc:#2A1A00;--oc:#7A1F00;--bg:linear-gradient(160deg,#F6E27A,#D4AF37 55%,#B8860B);--card:linear-gradient(145deg,#F3F4F6,#C0C0C0 60%,#9CA3AF);--t:#000;--mut:#000;--bd:#8a6a00;--ic:#000;--pbg:linear-gradient(135deg,#F6E27A,#D4AF37,#B8860B);--on:#000;--hbg:linear-gradient(110deg,#B8860B,#F6E27A,#D4AF37,#F6E27A,#B8860B);--hfg:#000;--sh:0 6px 18px rgba(80,55,0,.3);--gi:rgba(255,255,255,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg) fixed;color:var(--t);min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 18px;background:var(--hbg);color:var(--hfg);border-radius:0 0 28px 28px;box-shadow:var(--sh)}
[data-theme=gold] header{background-size:300% 100%;animation:shine 6s linear infinite}
h1{margin:0;font-size:1.35rem;font-weight:900}
header button{background:rgba(255,255,255,.2);border:0;color:inherit;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;cursor:pointer}
main{max-width:560px;margin:auto;padding:18px 16px calc(130px + env(safe-area-inset-bottom,0px))}
h2{text-align:center;font-size:1.6rem;margin:10px 0 2px;font-weight:900}
.hint{text-align:center;color:var(--mut);margin:0 0 14px;font-size:.9rem;font-weight:600}
.ic{width:24px;height:24px}.sm{width:16px;height:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:14px;font:700 1.05rem Cairo,sans-serif;background:var(--pbg);color:var(--on);box-shadow:var(--sh);cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}
.vsgo{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:3}
.ghost{background:transparent;color:var(--t);border:2px solid var(--bd);box-shadow:none}
.danger{background:#e5484d;color:#fff;margin:14px 0 8px}
.rnd{margin-bottom:16px;animation:pulse 2.4s infinite}
.card{position:relative;display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--bd);border-radius:24px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh);cursor:pointer;animation:up .5s both;animation-delay:calc(var(--i)*80ms);transition:transform .15s,opacity .2s}
.card:active{transform:scale(.97)}
.gi{width:62px;height:62px;border-radius:20px;background:var(--gi);color:var(--ic);display:grid;place-items:center;flex:none}
.gi .ic{width:32px;height:32px}
.ct{flex:1;display:flex;flex-direction:column;gap:2px}
.ct b{font-size:1.2rem}
.ct span{display:flex;align-items:center;gap:6px;color:var(--mut);font-weight:600}
.ct em{font-style:normal;font-size:.8rem;font-weight:700;color:var(--ic)}
.dim{opacity:.55}
.lk{opacity:.6;filter:grayscale(.85)}
[data-theme=gold] .lk{filter:none;opacity:.55}
.lockic{color:var(--t);width:26px;height:26px}
.fav{background:none;border:0;color:var(--mut);padding:6px;cursor:pointer}
.fav.on{color:#e5484d}
.fav.on svg{fill:currentColor;animation:pop .35s}
[data-theme=gold] .fav.on{color:#000}
.hl{outline:3px solid var(--ic);transform:scale(1.03)}
.shake{animation:shake .4s}
.rate{text-align:center;margin-top:22px;color:var(--mut);font-weight:600}
.stars{display:flex;justify-content:center;margin:6px 0 12px}
.stars button{background:none;border:0;color:var(--mut);padding:2px;cursor:pointer}
.stars .ic{width:30px;height:30px}
.stars .on{color:#f5b301}
.stars .on svg{fill:currentColor}
.rate small{display:block;margin-top:10px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;border:2px solid var(--bd);background:var(--card);color:var(--t);border-radius:18px;padding:12px 16px;font:600 1rem Cairo,sans-serif;outline:0}
input:focus{border-color:var(--ic)}
.add{width:auto;padding:0 22px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:10px 16px;margin-bottom:10px;font-weight:700;animation:up .3s both}
li.pop{animation:pop .4s}
li button{background:none;border:0;color:var(--mut);cursor:pointer}
.start{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:auto;max-width:528px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:2px solid var(--bd);border-radius:24px 24px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.08)}
nav button{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 .78rem Cairo,sans-serif;padding:6px;transition:.2s;cursor:pointer}
nav button.on{color:var(--ic);transform:translateY(-3px);font-weight:900}
[data-theme=gold] nav button{color:#000}
.ov{position:fixed;inset:0;background:rgba(10,8,25,.55);display:grid;place-items:center;padding:20px;z-index:20;animation:fade .2s}
.box{width:100%;max-width:420px;max-height:88vh;overflow:auto;background:var(--card);color:var(--t);border:2px solid var(--bd);border-radius:28px;padding:22px;animation:scale .25s}
.box h3{margin:0 0 14px;font-size:1.4rem}
table{width:100%;border-collapse:collapse;margin-bottom:16px}
th,td{padding:10px 6px;text-align:start;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-size:.85rem}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:700}
.sw button{width:52px;height:30px;border-radius:20px;border:0;background:var(--bd);position:relative;transition:.2s;cursor:pointer}
.sw b{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw .on{background:var(--ic)}
.sw .on b{inset-inline-start:25px}
.lbl{margin:12px 0 8px;color:var(--mut);font-weight:700}
.th{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.th button{border:2px solid var(--bd);background:transparent;color:var(--t);border-radius:16px;padding:10px 4px;font:700 .9rem Cairo,sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.th button.on{border-color:var(--ic);box-shadow:0 0 0 2px var(--ic)}
.th i{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.15)}
.t-light i{background:linear-gradient(135deg,#fff 50%,#6D4AFF 50%)}
.t-dark i{background:linear-gradient(135deg,#1D1A33 50%,#8B6CFF 50%)}
.t-gold i{background:linear-gradient(135deg,#F6E27A,#B8860B 55%,#C0C0C0 55%)}
#toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1B1630;color:#fff;padding:10px 18px;border-radius:16px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ic);outline-offset:2px}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
@keyframes scale{from{opacity:0;transform:scale(.9)}}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes pulse{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes shine{to{background-position:300% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.zk{margin-top:22px;text-align:center;background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:20px 18px;box-shadow:var(--sh);cursor:pointer}
.zk.f{animation:fade .5s}
.zi{margin:0 auto 6px;color:var(--ic)}.zi .ic{width:60px;height:60px}.k-k8{animation:spin 24s linear infinite}
.zk small{display:block;color:var(--mut);font-weight:700;font-size:.85rem}
.zk p{margin:8px 0 4px;font-size:1.2rem;font-weight:700;line-height:2}
.zk em{font-style:normal;font-size:.8rem;color:var(--mut)}
.ver{text-align:center;margin-top:18px;color:var(--mut);display:flex;flex-direction:column;align-items:center}
.ver small{font-size:.8rem}.ver .by{font-size:.62rem;letter-spacing:.25em;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}

<body>
<header></header>
<main id="app"></main>
<nav></nav>
<div id="modal"></div>
<div id="toast"></div>
<script>
'use strict';
// ألعاب جماعية - الواجهة الأولى
const $ = s => document.querySelector(s), K = 'aj_v1';
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

// أيقونات SVG خطية موحدة
const P = {
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.6a3.5 3.5 0 010 6.8M18 14.3c2 .7 3.5 2.6 3.5 5.2"/>',
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',
  cup:'<path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4c0 3 1.5 4.5 4 5M16 6h4c0 3-1.5 4.5-4 5M12 14v4M8 20h8"/>',
  set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 9h.01M9 15h.01M15 15h.01M12 12h.01"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  wink:'<circle cx="12" cy="12" r="9"/><path d="M8 10h2M14 10.5l2-1M8.5 15c2 2 5 2 7 0"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'
};
Object.assign(P, {
  k8: '<path d="M12 2L14.1 6.9L19.1 4.9L17.1 9.9L22 12L17.1 14.1L19.1 19.1L14.1 17.1L12 22L9.9 17.1L4.9 19.1L6.9 14.1L2 12L6.9 9.9L4.9 4.9L9.9 6.9Z"/><circle cx="12" cy="12" r="2"/>',
  moon: '<path d="M12 3a6 6 0 009 9 9 9 0 11-9-9z"/><path d="M17 3v4M15 5h4"/>',
  dome: '<path d="M4 21V11a8 8 0 0116 0v10M2 21h20M12 3V1M9 21v-5a3 3 0 016 0v5"/>',
  xo: '<path d="M3.5 3.5l8 8M11.5 3.5l-8 8"/><circle cx="16.5" cy="16.5" r="4.2"/>',
  c4: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8" cy="9" r="1.5"/><circle cx="12" cy="9" r="1.5"/><circle cx="16" cy="9" r="1.5"/><circle cx="8" cy="15" r="1.5"/><circle cx="12" cy="15" r="1.5"/><circle cx="16" cy="15" r="1.5"/>',
  pent: '<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/><circle cx="7" cy="7" r="1.7"/><circle cx="17" cy="17" r="1.7"/>'
});
const ic = (n, c = '') => `<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

// الألعاب: l = مغلقة. لفتح لعبة غيّر l إلى 0
const G = [
  {id:'bara', n:'برا السالفة', i:'eye', a:3, b:12, l:0},
  {id:'ghamza', n:'غمزة', i:'wink', a:5, b:12, l:1},
  {id:'tahqiq', n:'تحقيق', i:'search', a:4, b:12, l:1},
  {id:'xo', n:'إكس أو المتحركة', i:'xo', a:1, b:12, s:'1-2', l:0},
  {id:'c4', n:'أربعة على التوالي', i:'c4', a:1, b:12, s:'1-2', l:0},
  {id:'pent', n:'Pentago (بينتاغو)', i:'pent', a:1, b:12, s:'1-2', l:0}
];
const gm = id => G.find(g => g.id === id);

// الحالة (تُحفظ في localStorage)
const fresh = () => ({names:[], pts:{}, fav:[], mute:0, vib:1, theme:'light', rate:0});
let S = fresh();
try { Object.assign(S, JSON.parse(localStorage.getItem(K))); } catch (e) {}
const save = () => { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} };
const n = () => S.names.length;
const fits = g => !n() || (n() >= g.a && n() <= g.b);
// تستعملها الألعاب لإضافة نقاط للاعب
window.addPoints = (name, k) => { S.pts[name] = (S.pts[name] || 0) + k; save(); };

// الصوت والاهتزاز والتنبيهات
let ac;
const beep = (f = 520, d = .08) => {
  if (S.mute) return;
  try {
    ac = ac || new AudioContext();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.frequency.value = f; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(t + d);
  } catch (e) {}
};
const vib = p => { if (S.vib && navigator.vibrate) navigator.vibrate(p); };
const toast = m => {
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2000);
};
const applyTheme = () => {
  document.documentElement.dataset.theme = S.theme;
  $('meta[name=theme-color]').content = {light:'#6D4AFF', dark:'#1D1A33', gold:'#D4AF37', jahili:'#3B2210'}[S.theme] || '#6D4AFF';
};

// العرض
let T = 'games';
const tab = t => { T = t; render(); window.scrollTo(0, 0); };
function card(g, i) {
  const bad = !g.l && !fits(g), fav = S.fav.includes(g.id);
  const note = g.l ? 'قريباً' : bad ? (n() < g.a ? `تحتاج ${g.a} لاعبين على الأقل` : `الحد الأقصى ${g.b} لاعباً`) : '';
  return `<div class="card ${g.l ? 'lk' : ''} ${bad ? 'dim' : ''}" id="c-${g.id}" data-a="play" data-v="${g.id}" style="--i:${i}">
    <div class="gi">${ic(g.i)}</div>
    <div class="ct"><b>${g.n}</b><span>${ic('users', 'sm')}${g.s || g.a + '-' + g.b}</span>${note ? `<em>${note}</em>` : ''}</div>
    ${g.l ? ic('lock', 'lockic') : `<button class="fav ${fav ? 'on' : ''}" data-a="fav" data-v="${g.id}" aria-label="المفضلة">${ic('heart')}</button>`}
  </div>`;
}
// أذكار وأحاديث صحيحة تتبدل كل 30 ثانية أو بالضغط عليها، والأيقونة الإسلامية تتبدل معها
const Z = [
  ['استغفار', 'أستغفر الله العظيم الذي لا إله إلا هو الحي القيوم وأتوب إليه', 'رواه أبو داود والترمذي'],
  ['صلاة على النبي', 'اللهم صلِّ وسلِّم على نبينا محمد', ''],

  <button class="btn" data-b="go">ابدأ اللعبة</button>`);
}
B.cfg = (val, el) => { const [k, v] = val.split('|'); cfg[k] = k === 'cat' ? v : +v; el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); };
B.go = () => {
  const pl = [...S.names]; if (pl.length < 3) return toast('تحتاج 3 لاعبين على الأقل');
  const L = lists().find(l => l.id === cfg.cat); if (!L || !L.words.length) return toast('اختر قائمة فيها كلمات'); const [word, close] = rnd(L.words), vk = Math.min(cfg.out, pl.length - 2), none = Math.random() * 100 < cfg.prob;
  R = {pl, word, close, cat: L.name, pool: L.words, vk, none, outs: none ? [] : sh(pl).slice(0, vk), order: sh(pl), i: 0, votes: {}, vi: 0};
  deal();
};

// بوابة تمرير الجهاز (وفيها نافذة الغش للاعب "نضال" فقط: 3 ضغطات متتالية)
function gate(t, name, label, cb, cheatOn, d) {
  gcb = cb; gch = cheatOn && name === 'نضال'; tp = 0; clearTimeout(tt);
  put(t, `${d || ''}<div class="mid"><div class="gi">${ic('phone')}</div><p class="hint">مرّر الجهاز إلى</p><div class="nm">${esc(name)}</div></div><button class="btn" data-b="gate">${label}</button>`);
}
B.gate = () => {
  if (!gch) return gcb();
  tp++; clearTimeout(tt);
  if (tp >= 3) { tp = 0; return cheat(); }
  tt = setTimeout(() => { tp = 0; gcb(); }, 700);
};
function cheat() {
  modal(`<h3>غش</h3><p>${R.outs.includes('نضال') ? 'الكلمة السرية: <b>' + esc(R.word) + '</b>' : 'برا السالفة: <b>' + (R.outs.map(esc).join('، ') || 'لا أحد') + '</b>'}</p><button class="btn" data-a="close">إغلاق</button>`);
}

// 2) توزيع الأدوار
const dots = () => `<div class="dots">${R.pl.map((_, k) => `<i class="${k === R.i ? 'on' : ''}"></i>`).join('')}</div><p class="hint">اللاعب ${R.i + 1} من ${R.pl.length}</p>`;
function deal() { const p = R.pl[R.i]; gate('توزيع الأدوار', p, `أنا ${esc(p)} – اعرض الكلمة`, () => reveal(p), 1, dots()); }
function reveal(p) {
  const out = R.outs.includes(p), last = R.i === R.pl.length - 1;
  put('دورك', `${dots()}${out
    ? `<div class="big shake">${ic('eye')}<div>أنت برا السالفة!</div><small>حاول تكشف الموضوع من كلام الباقين</small></div>`
    : `<p class="hint">الكلمة السرية (لا تخلي أحد يشوف)</p><div class="big">${esc(R.word)}</div>`}
  <button class="btn" data-b="next">${last ? 'فهمت – ابدأ الأسئلة' : 'فهمت – مرّر للاعب التالي'}</button>`);
  if (out) vib([80, 60, 80]);
}
B.next = () => { if (R.i < R.pl.length - 1) { R.i++; deal(); } else questions(); };

// 3) الأسئلة
function questions() {
  put('الأسئلة', `${cfg.timer ? '<div class="tm" id="tm"></div>' : ''}
  <div class="sec"><h4>ترتيب الأسئلة</h4>${R.order.map((x, k) => `<div class="ord"><span>${k + 1}</span>${esc(x)}${k ? '' : '<em>يبدأ</em>'}</div>`).join('')}</div>
  <p class="hint">كل لاعب يسأل اللاعب الذي بعده، والأخير يسأل الأول. اسألوا عن الموضوع دون ذكر الكلمة!</p>
  <button class="btn" data-b="vote">انتهت الأسئلة – وقت التصويت</button>`);
  if (cfg.timer) {
    let s = cfg.timer * 60;
    const f = () => { const t = $('#tm'); if (t) t.textContent = `${s / 60 | 0}:${String(s % 60).padStart(2, '0')}`; };
    f(); tm = setInterval(() => { s--; f(); if (s <= 0) { clearInterval(tm); beep(300, .5); vib([200, 100, 200]); toast('انتهى الوقت! وقت التصويت'); } }, 1000);
  }
}

// 4) التصويت
B.vote = () => { R.vi = 0; vgate(); };
function vgate() { const v = R.pl[R.vi]; gate('التصويت', v, `أنا ${esc(v)} – صوّت`, vscreen, 0, `<p class="hint">المصوّت ${R.vi + 1} من ${R.pl.length}</p>`); }
function vscreen() {
  const v = R.pl[R.vi]; R.sel = [];
  put('التصويت', `<p class="hint">${esc(v)}، مين برا السالفة؟ اختر ${R.vk === 1 ? 'لاعباً واحداً' : 'لاعبين'}${cfg.prob > 0 ? ' أو «لا أحد»' : ''}</p>
  <div class="chips" style="justify-content:center;margin-bottom:12px"><span class="chip on" id="cn">0 من ${R.vk}</span></div>
  ${R.pl.map(x => x === v ? `<div class="opt" style="opacity:.4">${esc(x)}<span>(أنت)</span></div>` : `<button class="opt" data-b="pick" data-v="${esc(x)}">${esc(x)}</button>`).join('')}
  ${cfg.prob > 0 ? '<button class="opt" data-b="pick" data-v="__none__" style="border-style:dashed">لا أحد برا السالفة</button>' : ''}
  <button class="btn" data-b="cv" id="cv" disabled>تأكيد تصويتي</button>`);
}
B.pick = x => {
  if (x === '__none__') R.sel = R.sel[0] === x ? [] : [x];
  else { R.sel = R.sel.filter(y => y !== '__none__'); const i = R.sel.indexOf(x); if (i >= 0) R.sel.splice(i, 1); else { R.sel.push(x); if (R.sel.length > R.vk) R.sel.shift(); } }
  bs.querySelectorAll('[data-b=pick]').forEach(b => b.classList.toggle('on', R.sel.includes(b.dataset.v)));
  const nn = R.sel[0] === '__none__'; $('#cn').textContent = nn ? 'لا أحد' : `${R.sel.length} من ${R.vk}`; $('#cv').disabled = !nn && R.sel.length !== R.vk;
};
B.cv = () => { R.votes[R.pl[R.vi]] = [...R.sel]; ++R.vi < R.pl.length ? vgate() : tally(); };

// 5) احتساب الأصوات ثم التخمين الأخير
function tally() {
  const c = {}; R.pl.forEach(x => c[x] = 0); const nv = Object.values(R.votes).filter(a => a[0] === '__none__').length; Object.values(R.votes).forEach(a => a.forEach(x => { if (c.hasOwnProperty(x)) c[x]++; }));
  const s = [...R.pl].sort((a, b) => c[b] - c[a]), cut = c[s[R.vk - 1]];
  R.acc = cut > nv && !(s[R.vk] !== undefined && c[s[R.vk]] === cut) ? s.slice(0, R.vk) : [];
  R.gs = R.outs.filter(o => R.acc.includes(o)); R.gi = 0; R.right = [];
  guessNext();
}
function guessNext() {
  if (R.gi >= R.gs.length) return result();
  const g = R.gs[R.gi];
  gate('التخمين الأخير', g, `أنا ${esc(g)} – أخمّن`, () => {
    const base = [R.word, ...R.close], rest = sh(R.pool.map(w => w[0]).filter(w => !base.includes(w))), more = sh(Object.values(WORDS).flat().map(w => w[0]).filter(w => !base.includes(w) && !rest.includes(w))), opts = sh([...base, ...[...rest, ...more].slice(0, 6 - base.length)]);
    put('خمّن الكلمة', `<p class="hint">${esc(g)}، تم كشفك! ما الكلمة السرية؟</p>${opts.map(w => `<button class="opt" data-b="gs" data-v="${esc(w)}">${esc(w)}</button>`).join('')}<button class="btn ghost" data-b="gs" data-v="">تخطّى – ما أريد أخمن</button>`);
  }, 0, `<p class="hint">تم كشف ${esc(g)}</p>`);
}
B.gs = v => { if (v === R.word) R.right.push(R.gs[R.gi]); R.gi++; guessNext(); };

// 6) النتيجة والنقاط: برا السالفة غير المكشوف +2، المكشوف الذي خمّن صح +1، وإن فاز الباقون +1 لكل منهم
function result() {
  const out = R.outs, un = out.filter(o => !R.gs.includes(o)), win = !R.none && !un.length && !R.right.length, pts = {};
  if (!R.none) {
    out.forEach(o => { if (un.includes(o)) pts[o] = 2; else if (R.right.includes(o)) pts[o] = 1; });
    if (win) R.pl.filter(x => !out.includes(x)).forEach(x => pts[x] = 1);
  }
  Object.entries(pts).forEach(([n, k]) => addPoints(n, k));
  R.pl.forEach(x => gameRes.add('bara', x, pts[x] || 0)); gameRes.round('bara');
  const gr = gameRes.get('bara'); gr.st = gr.st || {}; if (R.none) gr.none = (gr.none || 0) + 1;
  R.pl.forEach(x => {
    const a = gr.st[x] = gr.st[x] || {p: 0, o: 0, h: 0, g: 0, f: 0, w: 0, l: 0}; a.p++;
    if (out.includes(x)) { a.o++; if (un.includes(x)) a.h++; else if (R.right.includes(x)) a.g++; else a.f++; }
    else if (!R.none) { if (win) a.w++; else a.l++; }
  });
  save();
  const rows = Object.entries(pts);
  put('النتيجة', `<h2>${R.none ? 'جولة بدون برا السالفة' : win ? 'تم كشفه!' : 'التمويه نجح!'}</h2>
  <div class="sec"><p class="hint">الكلمة السرية (${esc(R.cat)})</p><div class="big" style="margin:0">${esc(R.word)}</div></div>
  <div class="sec"><h4>برا السالفة فعلياً</h4>${R.none ? `لم يكن هناك أحد${R.acc.length ? ` (اتهمتم ${R.acc.map(esc).join('، ')} ظلماً)` : ' (لم تتهموا أحداً)'}` : out.map(o => `<span class="chip on">${esc(o)}</span>`).join(' ')}</div>
  <div class="sec"><h4>التصويت</h4><table>${R.pl.map(x => `<tr><td>${esc(x)}</td><td>${(R.votes[x] || []).map(y => y === '__none__' ? 'لا أحد' : esc(y)).join('، ')}</td></tr>`).join('')}</table></div>
  ${rows.length ? `<div class="sec"><h4>النقاط</h4>${rows.map(([n, k]) => `<div class="ord">${esc(n)}<em>+${k}</em></div>`).join('')}</div>` : ''}
  <button class="btn" data-b="again">جولة جديدة</button><button class="btn ghost" data-b="x">الرئيسية</button>`);
  if (win) beep(880, .25);
}
B.again = setup;
B.x = () => { clearInterval(tm); R = null; bs.style.display = 'none'; };

// ===== قوائمي: إنشاء وتسمية وتعديل (كلمات + 3 مقاربات اختيارية) =====
const parse = s => s.split(/[،,\n]/).map(x => x.trim()).filter(Boolean).slice(0, 3);
const find = id => lists().find(l => l.id === id);
const twice = (el, m, fn) => { if (!el.dataset.c) { el.dataset.c = 1; toast(m); setTimeout(() => el.dataset.c = '', 3000); } else fn(); };
function listsScreen() {
  const ls = [...lists()].sort((a, b) => b.fav - a.fav);
  put('قوائمي', `<div class="sec"><h4>إنشاء قائمة جديدة</h4><div class="row"><input id="ln" maxlength="20" placeholder="اسم القائمة"><button class="btn add" data-b="mk">إنشاء</button></div></div>
  ${ls.map(l => `<div class="sec li2"><b>${esc(l.name)}</b><small>${l.words.length} كلمة</small>
    <button class="fv ${l.fav ? 'on' : ''}" data-b="lfav" data-v="${l.id}" aria-label="المفضلة">${ic('heart')}</button>
    <button class="fv" data-b="le" data-v="${l.id}" aria-label="تعديل">${ic('edit')}</button>
    <button class="fv" data-b="ld" data-v="${l.id}" aria-label="حذف">${ic('x')}</button></div>`).join('')}
  <button class="btn ghost" data-b="lrs">استعادة القوائم الافتراضية</button><button class="btn ghost" data-b="home">رجوع</button>`);
}
function editor(id, k = -1) {
  const l = find(id); if (!l) return listsScreen();
  const w = k >= 0 ? l.words[k] : ['', []];
  put('تعديل القائمة', `<div class="sec"><h4>اسم القائمة</h4><input id="rn" style="width:100%" value="${esc(l.name)}" maxlength="20" data-b="ren" data-v="${id}"></div>
  <div class="sec"><h4>${k >= 0 ? 'تعديل الكلمة' : 'إضافة كلمة'}</h4>
    <input id="wn" style="width:100%;margin-bottom:8px" value="${esc(w[0])}" maxlength="24" placeholder="الكلمة">
    <input id="wc" style="width:100%;margin-bottom:10px" value="${esc(w[1].join('، '))}" placeholder="حتى 3 كلمات مقاربة، افصل بفاصلة (اختياري)">
    <button class="btn" data-b="ws" data-v="${id}|${k}">${k >= 0 ? 'حفظ التعديل' : 'إضافة'}</button></div>
  <div class="sec"><h4>الكلمات (${l.words.length})</h4>${l.words.map((x, i) => `<div class="ord">${esc(x[0])}<small>${x[1].map(esc).join('، ')}</small><div class="act"><button class="fv" data-b="we" data-v="${id}|${i}" aria-label="تعديل">${ic('edit')}</button><button class="fv" data-b="wd" data-v="${id}|${i}" aria-label="حذف">${ic('x')}</button></div></div>`).join('') || '<p class="hint">القائمة فارغة، أضف كلمات</p>'}</div>
  <button class="btn ghost" data-b="lists">رجوع للقوائم</button>`);
}
B.lists = listsScreen; B.home = setup;
B.mk = () => {
  const n = $('#ln').value.trim(); if (!n) return toast('اكتب اسم القائمة');
  if (lists().some(l => l.name === n)) return toast('الاسم مستعمل');

};
B.le = id => editor(id);
B.lfav = id => { const l = find(id); l.fav = l.fav ? 0 : 1; save(); listsScreen(); };
B.ld = (id, el) => twice(el, 'اضغط مرة أخرى لحذف القائمة', () => { S.bsLists = lists().filter(l => l.id !== id); save(); listsScreen(); });
B.lrs = () => { DEF.forEach(d => { if (!find(d.id)) lists().push(JSON.parse(JSON.stringify(d))); }); const n = mergeDef(); save(); listsScreen(); toast(n ? `تمت الاستعادة وإضافة ${n} كلمة ناقصة` : 'تمت استعادة الافتراضية'); };
B.ws = v => {
  const [id, k] = v.split('|'), i = +k, l = find(id), w = $('#wn').value.trim();
  if (!w) return toast('اكتب الكلمة');

// ===== نتائج خاصة بهذه اللعبة فقط (منفصلة عن النتائج العامة) =====
// شاشة نتائج اللعبة: تغطي كامل الشاشة وتُغلق بـ x أعلى اليمين
function resScreen() {
  const r = gameRes.get('bara'), st = r.st || {}, ks = [...new Set([...Object.keys(r.pts), ...Object.keys(st)])];

    return `<div class="pc"><div class="ph"><span class="rk r${i}">${i + 1}</span><b>${esc(x)}</b><em>${pt(x)} <small>نقطة</small></em></div>
    <div class="bar"><i style="width:${wr}%"></i></div><div class="bl"><span>نسبة الفوز</span><b>${wr}%</b></div>
    <div class="gr">${kp(s.p, 'مباراة لعبها')}${kp(s.o, 'مرات برا السالفة')}${kp(s.h, 'نجح بالتخفي')}${kp(s.g, 'كُشف ونجح بالتخمين')}${kp(s.f, 'فشل: كُشف ولم يخمّن')}${kp(pc(s.h + s.g, s.o) + '%', 'نسبة نجاحه برا السالفة')}${kp(s.w, 'فاز مع المجموعة')}${kp(s.l, 'خسر مع المجموعة')}</div></div>`; };
  const o = $('#bsr'); if (o) o.remove();
  bs.insertAdjacentHTML('beforeend', `<div id="bsr"><div class="rh"><button class="xb" data-b="xr" aria-label="إغلاق">${ic('x')}</button><b>نتائج برا السالفة</b></div>
  <div class="rb"><div class="gr3">${kp(r.rounds, 'عدد الجولات')}${kp(r.none || 0, 'جولات بلا برا السالفة')}${kp(ks[0] ? esc(ks[0]) : '-', 'المتصدر')}</div>
  ${ks.length ? ks.map(card).join('') : '<p class="hint">لا توجد نتائج بعد، العب جولة أولاً</p>'}
  <button class="btn danger" data-b="rr">تصفير نتائج هذه اللعبة</button></div></div>`);
}
B.res = resScreen;
B.xr = () => { const o = $('#bsr'); if (o) o.remove(); };
B.rr = (v, el) => twice(el, 'اضغط مرة أخرى لتصفير النتائج', () => { gameRes.reset('bara'); resScreen(); });

// نقطة الدخول التي يستدعيها app.js
window.openGame = id => {
  if (id !== 'bara') return toast('قريباً');
  if (!bs) {
    bs = document.createElement('div'); bs.id = 'bs'; document.body.appendChild(bs);
    bs.addEventListener('click', e => { const el = e.target.closest('[data-b]'); if (!el) return; beep(600); vib(10); if (B[el.dataset.b]) B[el.dataset.b](el.dataset.v, el); });
    bs.addEventListener('change', e => { if (e.target.dataset.b === 'ren') { const l = lists().find(x => x.id === e.target.dataset.v), n = e.target.value.trim(); if (l && n) { l.name = n; save(); toast('تم حفظ الاسم'); } } });
    bs.addEventListener('input', e => { if (e.target.dataset.b === 'prob') { cfg.prob = +e.target.value; $('#pv').textContent = cfg.prob; } });
  }
  bs.style.display = 'block'; setup();
};
})();
</script>
<script>

(() => {
const st = document.createElement('style');

document.head.appendChild(st);

const twice = (el, m, fn) => { if (!el.dataset.c) { el.dataset.c = 1; toast(m); setTimeout(() => el.dataset.c = '', 3000); } else fn(); };
const put = (t, b) => { pn.innerHTML = `<div class="w"><div class="bt"><b>${t}</b><button class="xb" data-n="x" aria-label="خروج">${ic('x')}</button></div>${b}</div>`; pn.scrollTop = 0; };
const rotIc = cw => cw
  ? '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>'
  : '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
const dot = s => `<span class="pnd pk${s}"></span>`;
const tone = (f0, f1, d, type = 'triangle', v = .18) => {
  if (S.mute) return;
  try {
    ac = ac || new AudioContext(); if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d + .03);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .04);
  } catch (e) {}
};

// ===== الإعداد =====
function setup() {
  M = null; const ns = S.names;
  if (!ns.length) { pn.style.display = 'none'; return toast('أضف أسماء اللاعبين أولاً'); }
  if (ns.length < 2) cfg.mode = 'ai';

  }
  const chip = (on, v, l) => `<button class="chip ${on ? 'on' : ''}" data-n="${v.split('|')[0]}" data-v="${v.slice(v.indexOf('|') + 1)}">${l}</button>`;
  const names = k => ns.map(x => chip(cfg[k] === x, 'p|' + k + '|' + esc(x), esc(x))).join('');
  put('بينتاغو', `<button class="btn ghost" data-n="res">نتائج اللعبة</button>
  <div class="sec" style="margin-top:14px"><h4>نمط اللعب</h4><div class="chips">${chip(cfg.mode === 'pvp', 'm|pvp', 'لاعبان على الجهاز')}${chip(cfg.mode === 'ai', 'm|ai', 'ضد الحاسوب')}</div></div>
  ${cfg.mode === 'pvp'
    ? `<div class="sec"><h4>${dot(1)}اللاعب الأسود (يبدأ أولاً)</h4><div class="chips">${names('B')}</div></div>
       <div class="sec"><h4>${dot(2)}اللاعب الأبيض</h4><div class="chips">${names('W')}</div></div>`
    : `<div class="sec"><h4>اسمك</h4><div class="chips">${names('H')}</div></div>
       <div class="sec"><h4>لونك</h4><div class="chips">${chip(cfg.me === 1, 'c|1', 'أسود (تبدأ أنت)')}${chip(cfg.me === 2, 'c|2', 'أبيض (يبدأ الحاسوب)')}</div></div>
       <div class="sec"><h4>مستوى الصعوبة</h4><div class="chips">${['easy', 'mid', 'hard'].map(k => chip(cfg.lvl === k, 'l|' + k, LV[k])).join('')}</div></div>`}
  <div class="sec"><h4>القوانين</h4><p class="hint" style="text-align:start">يتكوّن كل دور من مرحلتين: ضع حجرك في خانة فارغة، ثم دوّر أحد المربعات الأربعة 90 درجة يميناً أو يساراً (التدوير إلزامي). أول من يكوّن 5 أحجار متتالية من لونه أفقياً أو عمودياً أو قطرياً يفوز، ويُفحص الفوز بعد اكتمال الدور. إذا كوّن اللاعبان خمسة معاً أو امتلأت اللوحة دون فائز فالنتيجة تعادل.</p>
  <button class="btn ghost" data-n="help">شرح تفصيلي مع رسوم توضيحية</button></div>
  <button class="btn vsgo" data-n="go">ابدأ المباراة</button><button class="btn ghost" data-n="names">تغيير أسماء اللاعبين</button>`);
}
X.m = v => { if (v === 'pvp' && S.names.length < 2) return toast('أضف لاعباً ثانياً من «تعديل الأسماء» أو العب ضد الحاسوب'); cfg.mode = v; setup(); };
X.c = v => { cfg.me = +v; setup(); };
X.l = v => { cfg.lvl = v; setup(); };
X.p = v => {
  const a = v.indexOf('|'), k = v.slice(0, a), n = v.slice(a + 1);
  if (k === 'B' || k === 'W') { const o = k === 'B' ? 'W' : 'B'; if (cfg[o] === n) cfg[o] = cfg[k]; }
  cfg[k] = n; setup();
};
X.names = () => { X.x(); tab('names'); };
X.go = () => start(); X.again = () => start(); X.restart = () => start(); X.setup = setup;
X.x = () => { M = null; pn.style.display = 'none'; };

// ===== المباراة =====
const qHTML = q => {
  const cells = [...Array(9)].map((_, k) => { const i = ((q >> 1) * 3 + (k / 3 | 0)) * 6 + (q & 1) * 3 + k % 3; return `<button class="pnc e" data-n="cell" data-v="${i}" aria-label="خانة"><i class="pns"></i></button>`; }).join('');
  return `<div class="pnw ${q < 2 ? 'top' : 'bot'}"><div class="pnl"><button class="pnb" data-n="rot" data-v="${q}|-1" aria-label="تدوير هذا المربع يساراً (عكس عقارب الساعة)">${rotIc(false)}<span>يسار</span></button><button class="pnb" data-n="rot" data-v="${q}|1" aria-label="تدوير هذا المربع يميناً (مع عقارب الساعة)">${rotIc(true)}<span>يمين</span></button></div><div class="pnq">${cells}</div></div>`;
};
function start() {
  const ai = cfg.mode === 'ai', hc = cfg.me, ac2 = 3 - hc;
  M = {b: Array(36).fill(0), pl: ai ? {[hc]: cfg.H, [ac2]: 'الحاسوب (' + LV[cfg.lvl] + ')'} : {1: cfg.B, 2: cfg.W}, t: 1, phase: 1, n: 0, over: false, busy: false, last: -1, win: [], ai, aiC: ac2, lvl: cfg.lvl};
  put('بينتاغو', `<div class="pnpl" id="pnpl"></div><div class="pnph" id="pnph"></div><p class="pnt" id="pnt"></p>
  <div class="pna"><div class="png p1 t1" id="png">${[0, 1, 2, 3].map(qHTML).join('')}</div></div>
  <p class="hint" id="pnm"></p><div id="pnres"></div>
  <button class="btn ghost" data-n="help">شرح اللعبة</button>
  <button class="btn ghost" id="pnrs" data-n="restart">إعادة البدء</button><button class="btn ghost" id="pnend" data-n="setup">إنهاء المباراة</button>`);
  QE = [...pn.querySelectorAll('.pnq')]; WE = [...pn.querySelectorAll('.pnw')]; CE = [];
  QE.forEach((el, q) => [...el.children].forEach((c, k) => { CE[((q >> 1) * 3 + (k / 3 | 0)) * 6 + (q & 1) * 3 + k % 3] = c; }));
  paint(); upd(); maybeAI();
}
function paint(fresh = -1) {
  const wn = new Set(M.win);
  CE.forEach((c, i) => {
    const v = M.b[i];
    c.className = 'pnc ' + (v ? 's' + v : 'e') + (wn.has(i) ? ' wn' : '') + (M.phase === 2 && !M.over && i === M.last ? ' lp' : '');
    c.firstChild.className = 'pns' + (i === fresh ? ' new' : '');
  });
}
const locked = () => M.busy || M.over || (M.ai && M.t === M.aiC);
function upd() {
  const stt = gameRes.get('pent').st || {};
  const wins = s => (M.ai && s === M.aiC) ? SES.ai : (stt[M.pl[s]] || {}).w || 0;
  $('#pnpl').innerHTML = [1, 2].map(s => `<div class="pnp ${!M.over && M.t === s ? 'on' : ''}">${dot(s)}<div><b>${esc(M.pl[s])}</b><small>${wins(s)} فوز</small></div></div>`).join('');
  $('#pnph').innerHTML = M.over ? '' : `<span class="${M.phase === 1 ? 'on' : ''}"><b>1</b>ضع حجراً</span><span class="${M.phase === 2 ? 'on' : ''}"><b>2</b>دوّر مربعاً</span>`;
  $('#pnt').innerHTML = M.over ? '' : `الدور على <b>${esc(M.pl[M.t])}</b>${dot(M.t)}`;
  $('#png').className = 'png p' + M.phase + ' t' + M.t + (locked() ? ' lk' : '');
  const aiT = M.ai && M.t === M.aiC && !M.over;
  $('#pnm').textContent = M.over ? '' : aiT ? (M.phase === 1 ? 'الحاسوب يفكر…' : 'الحاسوب يدوّر…')
    : M.phase === 1 ? 'اختر خانة فارغة لوضع حجرك' : 'دوّر أي مربع: اسحبه بإصبعك أو اضغط يمين/يسار. للتراجع اضغط حجرك الأخير';
}
function doPlace(i) {
  const s = M.t; M.b[i] = s; M.n++; M.last = i; M.phase = 2;
  tone(s === 1 ? 420 : 560, 230, .11); vib(15);
  paint(i); upd();
}
const rm = matchMedia('(prefers-reduced-motion:reduce)').matches;
const setR = (el, v) => el.style.setProperty('--r', v + 'deg');
const ease = t => { t--; return 1 + 2.2 * t * t * t + 1.2 * t * t; };
const spin = (el, from, to, ms, done) => {
  const t0 = performance.now();
  const f = now => { const k = Math.min(1, (now - t0) / ms); setR(el, from + (to - from) * ease(k)); k < 1 ? requestAnimationFrame(f) : done(); };
  requestAnimationFrame(f);
};
function doRotate(q, d, from = 0) {
  const m = M; m.busy = true; upd();
  const el = QE[q], to = d * 90; el.classList.add('spin');
  tone(260, 620, .3, 'sine', .1); vib(20);
  spin(el, from, to, rm ? 1 : 160 + 300 * Math.abs(to - from) / 90, () => {
    if (M !== m) return;
    m.b = rotQ(m.b, q, d); m.last = -1;
    paint(); setR(el, 0); el.classList.remove('spin');
    WE.forEach(w => w.classList.remove('hot'));
    const wm = winMask(m.b);
    if (wm || m.n === 36) return finish(wm === 3 ? 0 : wm, wm);
    m.t = 3 - m.t; m.phase = 1; m.busy = false; upd(); maybeAI();
  });
}
function maybeAI() {
  if (!M.ai || M.t !== M.aiC || M.over) return;
  const m = M; m.busy = true; upd();
  setTimeout(() => {
    if (M !== m) return;
    const mv = aiMove(m.b, m.aiC, m.lvl);
    doPlace(mv.i);
    setTimeout(() => {
      if (M !== m) return;
      WE[mv.q].classList.add('hot');
      setTimeout(() => { if (M === m) doRotate(mv.q, mv.d); }, 380);
    }, 420);
  }, 380);
}
X.cell = v => {
  if (!M || M.over || M.busy) return;
  const i = +v;
  if (M.phase === 2 && i === M.last && !locked()) { M.b[i] = 0; M.n--; M.last = -1; M.phase = 1; tone(380, 260, .08); paint(); upd(); return; }
  if (M.phase !== 1) return toast('دوّر أحد المربعات أولاً، التدوير إلزامي');
  if (M.b[i]) { const c = CE[i]; c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); vib([30, 40, 30]); return toast('هذه الخانة مشغولة'); }
  doPlace(i);
};
X.rot = v => {
  if (!M || M.over || M.busy) return;
  if (M.phase !== 2) return toast('ضع حجرك في خانة فارغة أولاً');
  const [q, d] = v.split('|').map(Number); doRotate(q, d);
};
function finish(w, mask) {
  M.over = true; M.busy = false;
  const r = gameRes.get('pent'); r.st = r.st || {};
  [1, 2].forEach(s => {
    if (M.ai && s === M.aiC) return;
    const n = M.pl[s], t = r.st[n] = r.st[n] || {p: 0, w: 0, l: 0, d: 0, bw: 0, ww: 0, ap: 0, aw: 0};
    t.p++; if (!w) t.d++; else if (w === s) { t.w++; t[s === 1 ? 'bw' : 'ww']++; } else t.l++;
    if (M.ai) { t.ap = (t.ap || 0) + 1; if (w === s) t.aw = (t.aw || 0) + 1; }
    if (!M.ai) gameRes.add('pent', n, w === s ? 1 : 0);
  });
  if (M.ai && w === M.aiC) SES.ai++;
  if (w && !M.ai) addPoints(M.pl[w], 1);
  if (!w) r.dr = (r.dr || 0) + 1;
  gameRes.round('pent'); save();
  M.win = mask ? winCells(M.b, mask) : [];
  paint(); upd();
  $('#pnend').style.display = 'none'; $('#pnrs').style.display = 'none';
  const sub = w ? `بتكوين 5 أحجار ${CN[w]} متتالية` : mask === 3 ? 'كوّن اللاعبان 5 أحجار متتالية في الوقت نفسه' : 'امتلأت اللوحة دون فائز';
  $('#pnres').innerHTML = `<div class="big">${ic(w ? 'cup' : 'users')}<div>${w ? 'فاز ' + esc(M.pl[w]) + '!' : 'تعادل'}</div><small>${sub}</small></div>
  <button class="btn" data-n="again">إعادة المباراة</button><button class="btn ghost" data-n="res">نتائج اللعبة</button><button class="btn ghost" data-n="setup">تغيير اللاعبين</button><button class="btn ghost" data-n="x">الرئيسية</button>`;
  $('#pnres').scrollIntoView({behavior: 'smooth', block: 'nearest'});
  if (w && !(M.ai && w === M.aiC)) { beep(660, .12); setTimeout(() => beep(880, .12), 140); setTimeout(() => beep(1040, .25), 280); vib([60, 40, 60]); } else beep(300, .3);
}

// ===== نتائج خاصة ببينتاغو فقط =====
function resP() {
  const r = gameRes.get('pent'), stt = r.st || {}, ks = [...new Set([...Object.keys(r.pts), ...Object.keys(stt)])];
  const g = x => Object.assign({p: 0, w: 0, l: 0, d: 0, bw: 0, ww: 0, ap: 0, aw: 0}, stt[x]);
  const pt = x => r.pts[x] || 0, pc = (a, b) => b ? Math.round(a * 100 / b) : 0;
  ks.sort((a, b) => pt(b) - pt(a) || g(b).w - g(a).w);
  const kp = (v, l) => `<div class="kp"><b>${v}</b><span>${l}</span></div>`;
  const card = (x, i) => { const s = g(x), wr = pc(s.w, s.p);
    return `<div class="pc"><div class="ph"><span class="rk r${i}">${i + 1}</span><b>${esc(x)}</b><em>${pt(x)} <small>نقطة</small></em></div>
    <div class="bar"><i style="width:${wr}%"></i></div><div class="bl"><span>نسبة الفوز</span><b>${wr}%</b></div>
    <div class="gr">${kp(s.p, 'مباراة لعبها')}${kp(s.w, 'فاز')}${kp(s.l, 'خسر')}${kp(s.d, 'تعادل')}${kp(s.bw, 'فاز بالأسود')}${kp(s.ww, 'فاز بالأبيض')}${kp(s.aw + ' من ' + s.ap, 'فوز ضد الحاسوب')}</div></div>`; };
  const o = $('#pnr'); if (o) o.remove();
  pn.insertAdjacentHTML('beforeend', `<div id="pnr"><div class="rh"><button class="xb" data-n="xr" aria-label="إغلاق">${ic('x')}</button><b>نتائج بينتاغو</b></div>
  <div class="rb"><div class="gr3">${kp(r.rounds, 'عدد المباريات')}${kp(r.dr || 0, 'مباريات تعادل')}${kp(ks[0] ? esc(ks[0]) : '-', 'المتصدر')}</div>
  ${ks.length ? ks.map(card).join('') : '<p class="hint">لا توجد نتائج بعد، العب مباراة أولاً</p>'}
  <p class="hint">النقاط تُحسب للمباريات بين لاعبين فقط، أما المباريات ضد الحاسوب فتظهر في الإحصائيات.</p>
  <button class="btn danger" data-n="rr">تصفير نتائج هذه اللعبة</button></div></div>`);
}
X.res = resP;
X.xr = () => { const o = $('#pnr'); if (o) o.remove(); };
X.rr = (v, el) => twice(el, 'اضغط مرة أخرى لتصفير النتائج', () => { gameRes.reset('pent'); resP(); });

// ===== الشرح التفصيلي بالرسوم (الرسوم تُحسب بنفس محرك اللعبة فلا تحتمل خطأً) =====
const MQ = 66, MG = 6, MU = 20;
function mini(b, o = {}) {
  const W = MQ * 2 + MG, pos = i => { const r = i / 6 | 0, c = i % 6; return [(c >= 3 ? MQ + MG : 0) + 3 + (c % 3) * MU + MU / 2, (r >= 3 ? MQ + MG : 0) + 3 + (r % 3) * MU + MU / 2]; };
  let s = `<svg viewBox="-5 -5 ${W + 10} ${W + 10}" class="pnmini" aria-hidden="true">`;
  for (let q = 0; q < 4; q++) s += `<rect x="${(q & 1) * (MQ + MG)}" y="${(q >> 1) * (MQ + MG)}" width="${MQ}" height="${MQ}" rx="9" fill="#7A1F2A"${o.q === q ? ' stroke="#FFD34D" stroke-width="3"' : ''}/>`;
  for (let i = 0; i < 36; i++) {
    const [x, y] = pos(i), v = b[i];
    s += `<circle cx="${x}" cy="${y}" r="8.3" fill="#2a070c"/>`;
    if (v) {
      s += `<circle cx="${x}" cy="${y}" r="7.7" fill="${v === 1 ? '#151515' : '#f3f3f3'}" stroke="${v === 1 ? '#000' : '#9a9a9a'}" stroke-width=".8"/><circle cx="${x - 2.2}" cy="${y - 2.4}" r="2.2" fill="#fff" opacity="${v === 1 ? .25 : .7}"/>`;
      if (o.num && o.num[i]) s += `<text x="${x}" y="${y + 3.4}" text-anchor="middle" font-size="9.5" font-weight="800" fill="${v === 1 ? '#fff' : '#111'}" font-family="Cairo,sans-serif">${o.num[i]}</text>`;
    }
  }
  (o.hl || []).forEach(i => { const [x, y] = pos(i); s += `<circle cx="${x}" cy="${y}" r="10" fill="none" stroke="#FFD34D" stroke-width="2.6"/>`; });
  if (o.arr) {
    const [q, d] = o.arr, cx = (q & 1) * (MQ + MG) + MQ / 2, cy = (q >> 1) * (MQ + MG) + MQ / 2, R = 27;
    const a0 = (d > 0 ? -190 : 10) * Math.PI / 180, a1 = (d > 0 ? 10 : -190) * Math.PI / 180;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const t = d > 0 ? [-Math.sin(a1), Math.cos(a1)] : [Math.sin(a1), -Math.cos(a1)], n = [-t[1], t[0]];
    s += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 1 ${d > 0 ? 1 : 0} ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="#FFD34D" stroke-width="3.2" stroke-linecap="round"/>`;
    s += `<polygon fill="#FFD34D" points="${(x1 + t[0] * 8).toFixed(1)},${(y1 + t[1] * 8).toFixed(1)} ${(x1 - t[0] * 2 + n[0] * 6).toFixed(1)},${(y1 - t[1] * 2 + n[1] * 6).toFixed(1)} ${(x1 - t[0] * 2 - n[0] * 6).toFixed(1)},${(y1 - t[1] * 2 - n[1] * 6).toFixed(1)}"/>`;
  }
  return s + '</svg>';
}
const fig = (svg, cap, n) => `<figure>${svg}<figcaption>${n ? `<b>${n}</b>` : ''}${cap}</figcaption></figure>`;
function helpHTML() {
  const E = () => Array(36).fill(0), mk = (bl, wh) => { const b = E(); bl.forEach(i => b[i] = 1); wh.forEach(i => b[i] = 2); return b; };
  // 1) مثال دور كامل: الأبيض يضع حجراً في الخانة 16 ثم يدوّر المربع الأعلى يميناً
  const base = mk([0, 10, 19, 28, 32], [3, 14, 21, 24]), placed = base.slice(); placed[16] = 2; const after = rotQ(placed, 1, 1);
  // 2) التدوير: ثلاثة أحجار مرقّمة في المربع الأعلى يساراً
  const rb = mk([0], [2, 7]), lab = Array(36).fill(0); lab[0] = 1; lab[2] = 2; lab[7] = 3;
  const lcw = rotQ(lab, 0, 1), lcc = rotQ(lab, 0, -1);
  const num = a => Object.fromEntries(a.map((v, i) => [i, v]).filter(x => x[1]));
  // 3) فوز بالتدوير
  const wb = mk([0, 14, 25, 28, 33], [7, 13, 9, 10]), wp = wb.slice(); wp[1] = 2; const wa = rotQ(wp, 0, 1), wl = [6, 7, 8, 9, 10];
  return `<div class="pnx">
  <div class="sec"><h4>ما هي اللعبة؟</h4><p>بينتاغو لعبة استراتيجية للاعبين اثنين. هدفك أن تصنع خمسة أحجار متتالية من لونك، لكن اللوحة نفسها تتحرك: ففي كل دور تدوّر جزءاً منها، فتتبدل مواقع الأحجار وتتغير خطط الطرفين.</p></div>
  <div class="sec"><h4>مكونات اللعبة</h4><div class="pnfg">${fig(mini(base, {}), 'اللوحة: 4 مربعات، في كل مربع 3×3 خانات')}</div>
  <div class="pnxl"><div class="it"><b>•</b><span>اللوحة 4 مربعات مرتبة 2×2، وكل مربع فيه 9 خانات، فالمجموع 36 خانة.</span></div><div class="it"><b>•</b><span>أحجار سوداء للاعب وبيضاء للآخر، ويبدأ صاحب الأسود.</span></div><div class="it"><b>•</b><span>كل مربع يدور وحده، وتتحرك أحجاره معه.</span></div></div></div>
  <div class="sec"><h4>هدف اللعبة</h4><p>كوّن 5 أحجار متتالية أو أكثر من لونك، في أي اتجاه، ويجوز أن يمتد الخط عبر أكثر من مربع:</p>
  <div class="pnfg">${fig(mini(mk([], [12, 13, 14, 15, 16]), {hl: [12, 13, 14, 15, 16]}), 'أفقياً')}${fig(mini(mk([10, 16, 22, 28, 34], []), {hl: [10, 16, 22, 28, 34]}), 'عمودياً')}${fig(mini(mk([], [0, 7, 14, 21, 28]), {hl: [0, 7, 14, 21, 28]}), 'قطرياً')}</div></div>
  <div class="sec"><h4>خطوات الدور الواحد</h4><p>كل دور له مرحلتان إلزاميتان بهذا الترتيب:</p>
  <div class="pnxl"><div class="it"><b>1</b><span><b>ضع حجرك</b> في أي خانة فارغة.</span></div><div class="it"><b>2</b><span><b>دوّر مربعاً</b> من المربعات الأربعة 90 درجة، يميناً أو يساراً. لا يمكن تخطي التدوير.</span></div></div>
  <p>بعدها ينتقل الدور إلى الخصم. هذا مثال لدور اللاعب الأبيض:</p>
  <div class="pnfg">${fig(mini(base, {}), 'اللوحة قبل الدور')}${fig(mini(placed, {hl: [16]}), 'يضع الأبيض حجراً في الخانة المحددة', 1)}${fig(mini(placed, {q: 1, arr: [1, 1]}), 'يدوّر المربع الأعلى يميناً مع عقارب الساعة', 2)}${fig(mini(after, {}), 'الشكل بعد التدوير', 3)}</div></div>
  <div class="sec"><h4>كيف يعمل التدوير؟</h4><p>الأحجار تنتقل مع المربع إلى مواقعها الجديدة، فلا يضيع حجر ولا يتكرر. هنا ثلاثة أحجار مرقّمة لتتبّع حركتها:</p>
  <div class="pnfg">${fig(mini(rb, {num: num(lab), q: 0}), 'قبل التدوير')}${fig(mini(rotQ(rb, 0, 1), {num: num(lcw), arr: [0, 1]}), 'يميناً (مع عقارب الساعة)')}${fig(mini(rotQ(rb, 0, -1), {num: num(lcc), arr: [0, -1]}), 'يساراً (عكس عقارب الساعة)')}</div>
  <div class="pnxl"><div class="it"><b>•</b><span>يمكنك تدوير أي مربع، حتى لو كان فارغاً أو فيه أحجار خصمك فقط، ولا يشترط أن يكون المربع الذي وضعت فيه حجرك.</span></div><div class="it"><b>•</b><span>الخانة الوسطى في كل مربع لا تتحرك عند تدويره، ولذلك تعد مواقع قوية.</span></div></div></div>
  <div class="sec"><h4>مثال على الفوز بالتدوير</h4><p>يملك الأبيض 4 أحجار، وهو لا يكوّن خمسة بعد. يضع حجراً في الوسط العلوي من المربع الأيسر، ثم يدوّر هذا المربع يميناً، فيستلقي عموده الأوسط ليصبح جزءاً من صف أفقي كامل:</p>
  <div class="pnfg">${fig(mini(wb, {}), 'قبل الدور')}${fig(mini(wp, {hl: [1]}), 'وضع الحجر', 1)}${fig(mini(wp, {q: 0, arr: [0, 1]}), 'تدوير المربع يميناً', 2)}${fig(mini(wa, {hl: wl}), 'فوز: 5 أحجار متتالية', 3)}</div></div>
  <div class="sec"><h4>متى تنتهي المباراة؟</h4><div class="pnxl"><div class="it"><b>•</b><span>يُفحص الفوز بعد اكتمال الدور كله، أي بعد التدوير.</span></div><div class="it"><b>•</b><span>قد يصنع تدويرك خمسة أحجار لخصمك فيفوز هو، فانتبه لأثر كل تدوير.</span></div><div class="it"><b>•</b><span>إذا كوّن اللاعبان خمسة أحجار معاً بعد التدوير نفسه، فالنتيجة تعادل.</span></div><div class="it"><b>•</b><span>إذا امتلأت الخانات الـ 36 وانتهى آخر تدوير دون فائز، فالنتيجة تعادل.</span></div></div></div>
  <div class="sec"><h4>نصائح سريعة</h4><div class="pnxl"><div class="it"><b>•</b><span>احتل الخانات الوسطى للمربعات الأربعة لأنها ثابتة عند التدوير.</span></div><div class="it"><b>•</b><span>فكّر في تدوير يفسد خطة خصمك أو يقرّب أحجارك من بعضها.</span></div><div class="it"><b>•</b><span>قبل كل تدوير تأكد أنه لا يمنح الخصم خمسة متتالية.</span></div></div></div>
  <button class="btn" data-n="hx">فهمت، إغلاق</button></div>`;
}
X.help = () => {
  const o = $('#pnh'); if (o) o.remove();
  pn.insertAdjacentHTML('beforeend', `<div id="pnh"><div class="rh"><button class="xb" data-n="hx" aria-label="إغلاق">${ic('x')}</button><b>شرح بينتاغو</b></div><div class="rb">${helpHTML()}</div></div>`);
};
X.hx = () => { const o = $('#pnh'); if (o) o.remove(); };

// تدوير بالسحب: المربع يتبع إصبعك ثم يثبت على أقرب 90 درجة
function dragInit() {
  let g = null;
  const ang = (e, r) => Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 57.2958;
  const ok = () => M && !M.over && !M.busy && M.phase === 2 && !locked();
  pn.addEventListener('pointerdown', e => {
    const el = e.target.closest('.pnq'); if (!el || !ok()) return;
    g = {q: QE.indexOf(el), el, r: el.getBoundingClientRect(), a: 0, d: 0, x: e.clientX, y: e.clientY, on: 0, id: e.pointerId};
  });
  pn.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return;
    if (!g.on) { if (Math.hypot(e.clientX - g.x, e.clientY - g.y) < 8) return; g.on = 1; g.a = ang({clientX: g.x, clientY: g.y}, g.r); g.el.setPointerCapture(e.pointerId); g.el.classList.add('spin'); }
    const a = ang(e, g.r); g.d = Math.max(-100, Math.min(100, g.d + (a - g.a + 540) % 360 - 180)); g.a = a; setR(g.el, g.d);
  });
  const end = e => {
    if (!g || e.pointerId !== g.id) return; const k = g; g = null; if (!k.on) return;
    if (Math.abs(k.d) > 28 && ok()) doRotate(k.q, k.d > 0 ? 1 : -1, k.d);
    else spin(k.el, k.d, 0, 200, () => k.el.classList.remove('spin'));
  };
  pn.addEventListener('pointerup', end); pn.addEventListener('pointercancel', end);
}
const prev = window.openGame;
window.openGame = id => {
  if (id !== 'pent') return prev ? prev(id) : toast('قريباً');
  if (!pn) {
    pn = document.createElement('div'); pn.id = 'pn'; document.body.appendChild(pn); dragInit();
    pn.addEventListener('click', e => { const el = e.target.closest('[data-n]'); if (!el) return; vib(10); if (X[el.dataset.n]) X[el.dataset.n](el.dataset.v, el); });
  }
  pn.style.display = 'block'; setup();
};
})();
